name: Bundle Analysis

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/home/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/home
          npm ci

      - name: Build application
        run: |
          cd apps/home
          npm run build

      - name: Analyze bundle size
        run: |
          cd apps/home
          npx @next/bundle-analyzer

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: apps/home/.next/analyze/
          retention-days: 7

      - name: Comment bundle size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // Read bundle analysis results
              const analysisPath = path.join('apps/home/.next/analyze');
              if (fs.existsSync(analysisPath)) {
                const files = fs.readdirSync(analysisPath);
                const bundleFiles = files.filter(file => file.endsWith('.html'));
                
                if (bundleFiles.length > 0) {
                  const comment = `## 📊 Bundle Analysis Results
                  
                  Bundle analysis completed successfully. Check the artifacts for detailed reports.
                  
                  **Files analyzed:** ${bundleFiles.length}
                  
                  📁 Download the analysis report from the workflow artifacts.`;
                  
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: comment
                  });
                }
              }
            } catch (error) {
              console.log('Bundle analysis comment failed:', error.message);
            }
