name: Dependency Update

on:
  schedule:
    # Run dependency check weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  dependency-update:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/home/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/home
          npm ci

      - name: Check for outdated packages
        run: |
          cd apps/home
          npm outdated --json > outdated.json || true

      - name: Check for security vulnerabilities
        run: |
          cd apps/home
          npm audit --json > audit.json || true

      - name: Create dependency report
        run: |
          cd apps/home
          echo "# 📦 Dependency Update Report" > dependency-report.md
          echo "" >> dependency-report.md
          echo "Generated on: $(date)" >> dependency-report.md
          echo "" >> dependency-report.md
          
          if [ -f outdated.json ] && [ -s outdated.json ]; then
            echo "## 🔄 Outdated Packages" >> dependency-report.md
            echo "" >> dependency-report.md
            echo "\`\`\`json" >> dependency-report.md
            cat outdated.json >> dependency-report.md
            echo "\`\`\`" >> dependency-report.md
            echo "" >> dependency-report.md
          else
            echo "## ✅ All packages are up to date!" >> dependency-report.md
            echo "" >> dependency-report.md
          fi
          
          if [ -f audit.json ] && [ -s audit.json ]; then
            echo "## 🔒 Security Audit" >> dependency-report.md
            echo "" >> dependency-report.md
            echo "\`\`\`json" >> dependency-report.md
            cat audit.json >> dependency-report.md
            echo "\`\`\`" >> dependency-report.md
          fi

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            apps/home/dependency-report.md
            apps/home/outdated.json
            apps/home/audit.json
          retention-days: 30

      - name: Create issue for major updates
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const outdatedPath = path.join('apps/home/outdated.json');
              if (fs.existsSync(outdatedPath)) {
                const outdated = JSON.parse(fs.readFileSync(outdatedPath, 'utf8'));
                const majorUpdates = Object.entries(outdated).filter(([name, info]) => {
                  if (typeof info === 'object' && info.current && info.latest) {
                    const currentMajor = info.current.split('.')[0];
                    const latestMajor = info.latest.split('.')[0];
                    return currentMajor !== latestMajor;
                  }
                  return false;
                });
                
                if (majorUpdates.length > 0) {
                  const issueBody = `## 🔄 Major Dependency Updates Available
                  
                  The following packages have major version updates available:
                  
                  ${majorUpdates.map(([name, info]) => 
                    `- **${name}**: ${info.current} → ${info.latest}`
                  ).join('\n')}
                  
                  ### ⚠️ Important Notes
                  - Major updates may contain breaking changes
                  - Review changelogs before updating
                  - Test thoroughly after updating
                  
                  ### 📋 Action Items
                  - [ ] Review breaking changes
                  - [ ] Update dependencies
                  - [ ] Run tests
                  - [ ] Update code if needed
                  
                  ---
                  *This issue was automatically generated by the dependency update workflow.*`;
                  
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: '🔄 Major Dependency Updates Available',
                    body: issueBody,
                    labels: ['dependencies', 'maintenance', 'automated']
                  });
                }
              }
            } catch (error) {
              console.log('Failed to create dependency update issue:', error.message);
            }
