name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main, develop]

jobs:
  pr-naming-check:
    name: PR Naming Convention Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            update
            update-design
            refactor
            docs
            style
            test
            chore
            ci
            perf
            build
            revert
          requireScope: false
          disallowScopes: |
            wip
            temp
            test
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
          validateSingleCommit: false

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    needs: pr-naming-check
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/home/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/home
          npm ci

      - name: Run linting
        run: |
          cd apps/home
          npm run lint

      - name: Run type checking
        run: |
          cd apps/home
          npm run type-check

      - name: Run tests
        run: |
          cd apps/home
          npm run test -- --coverage --watchAll=false

      - name: Build application
        run: |
          cd apps/home
          npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: apps/home/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: pr-naming-check
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/home/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/home
          npm ci

      - name: Run security audit
        run: |
          cd apps/home
          npm audit --audit-level=moderate

      - name: Check for known vulnerabilities
        run: |
          cd apps/home
          npx audit-ci --config audit-ci.json

  bundle-size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: pr-naming-check
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/home/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/home
          npm ci

      - name: Build application
        run: |
          cd apps/home
          npm run build

      - name: Analyze bundle size
        run: |
          cd apps/home
          npx @next/bundle-analyzer

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-naming-check, test-and-build, security-audit, bundle-size-check]
    if: always() && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const checks = {
              naming: '${{ needs.pr-naming-check.result }}',
              tests: '${{ needs.test-and-build.result }}',
              security: '${{ needs.security-audit.result }}',
              bundle: '${{ needs.bundle-size-check.result }}'
            };

            const statusEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                default: return '⏳';
              }
            };

            const comment = `## 🔍 PR Quality Checks Summary

            | Check | Status | Description |
            |-------|--------|-------------|
            | **PR Naming** | ${statusEmoji(checks.naming)} | Conventional commit format |
            | **Tests & Build** | ${statusEmoji(checks.tests)} | Linting, type-check, tests, build |
            | **Security Audit** | ${statusEmoji(checks.security)} | Vulnerability scan |
            | **Bundle Size** | ${statusEmoji(checks.bundle)} | Performance analysis |

            ### 📋 PR Details
            - **Title**: ${pr.title}
            - **Author**: @${pr.user.login}
            - **Base Branch**: ${pr.base.ref}
            - **Head Branch**: ${pr.head.ref}

            ${Object.values(checks).includes('failure') ? 
              '⚠️ **Some checks failed. Please review and fix the issues before merging.**' : 
              '🎉 **All checks passed! This PR is ready for review.**'
            }`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
