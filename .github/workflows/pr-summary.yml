name: PR Summary

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main, develop]

jobs:
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Wait for other workflows
        run: sleep 30

      - name: PR Summary
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Get workflow run status
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr-naming-check.yml',
              head_sha: pr.head.sha,
              per_page: 1
            });

            const { data: testRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test-and-build.yml',
              head_sha: pr.head.sha,
              per_page: 1
            });

            const { data: securityRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security-audit.yml',
              head_sha: pr.head.sha,
              per_page: 1
            });

            const { data: bundleRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bundle-analysis.yml',
              head_sha: pr.head.sha,
              per_page: 1
            });

            const getStatus = (runs) => {
              if (!runs.workflow_runs || runs.workflow_runs.length === 0) return '⏳';
              const run = runs.workflow_runs[0];
              switch(run.conclusion) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'cancelled': return '⏹️';
                default: return '⏳';
              }
            };

            const checks = {
              naming: getStatus(runs),
              tests: getStatus(testRuns),
              security: getStatus(securityRuns),
              bundle: getStatus(bundleRuns)
            };

            const comment = `## 🔍 PR Quality Checks Summary

            | Check | Status | Description |
            |-------|--------|-------------|
            | **PR Naming** | ${checks.naming} | Conventional commit format |
            | **Tests & Build** | ${checks.tests} | Linting, type-check, tests, build |
            | **Security Audit** | ${checks.security} | Vulnerability scan |
            | **Bundle Analysis** | ${checks.bundle} | Performance analysis |

            ### 📋 PR Details
            - **Title**: ${pr.title}
            - **Author**: @${pr.user.login}
            - **Base Branch**: ${pr.base.ref}
            - **Head Branch**: ${pr.head.ref}
            - **Files Changed**: ${pr.changed_files}
            - **Additions**: +${pr.additions}
            - **Deletions**: -${pr.deletions}

            ${Object.values(checks).includes('❌') ? 
              '⚠️ **Some checks failed. Please review and fix the issues before merging.**' : 
              Object.values(checks).includes('⏳') ?
              '⏳ **Checks are still running. Please wait for completion.**' :
              '🎉 **All checks passed! This PR is ready for review.**'
            }

            ---
            *This summary is automatically generated by GitHub Actions.*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
